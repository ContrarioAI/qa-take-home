<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ATS — Submit Candidate</title>
    <style>
      body { font-family: system-ui, sans-serif; max-width: 760px; margin: 2rem auto; padding: 0 1rem; }
      h1 { font-size: 1.25rem; }
      h2 { margin-top: 2rem; }
      label { display: block; margin: 0.75rem 0 0.25rem; font-weight: 600; font-size: 0.9rem; }
      input, select, textarea { width: 100%; padding: 0.5rem; box-sizing: border-box; }
      button { margin: 0.75rem 0.5rem 0 0; padding: 0.6rem 1.2rem; font-size: 1rem; cursor: pointer; }
      .answer-row { display: grid; grid-template-columns: 10rem 1fr auto; gap: 0.5rem; align-items: start; margin-bottom: 0.5rem; }
      .answer-row button { margin-top: 0; }
      .qa-controls { border-top: 1px solid #ccc; margin-top: 2rem; padding-top: 1rem; }
      pre { background: #f4f4f4; padding: 1rem; overflow: auto; white-space: pre-wrap; }
      .status { font-weight: 700; }
      @media (max-width: 640px) {
        .answer-row { grid-template-columns: 1fr; }
      }
    </style>
  </head>
  <body>
    <h1>Submit Candidate</h1>

    <label for="userId">Recruiter (x-user-id header)</label>
    <select id="userId">
      <option value="u_recruiter_direct">u_recruiter_direct (direct access to job_active/job_exclusive)</option>
      <option value="u_recruiter_selfserve">u_recruiter_selfserve (no access, self-serve)</option>
      <option value="u_recruiter_agency">u_recruiter_agency (no access, agency)</option>
      <option value="u_non_recruiter">u_non_recruiter (not a recruiter)</option>
      <option value="u_recruiter_autoapprove">u_recruiter_autoapprove (auto-approve, direct to job_kombo)</option>
      <option value="u_recruiter_bypass1">u_recruiter_bypass1 (bypass quota 1)</option>
      <option value="u_recruiter_bypass0">u_recruiter_bypass0 (bypass quota 0)</option>
    </select>

    <label for="jobId">Role</label>
    <select id="jobId">
      <option value="job_active">job_active</option>
      <option value="job_inactive">job_inactive</option>
      <option value="job_deleted">job_deleted</option>
      <option value="job_exclusive">job_exclusive</option>
      <option value="job_kombo">job_kombo</option>
    </select>

    <label for="candidateId">Candidate ID (optional)</label>
    <input id="candidateId" placeholder="e.g. rc_with_resume" />

    <label for="name">Candidate name</label>
    <input id="name" value="Alan Turing" />

    <label for="email">Email</label>
    <input id="email" value="Alan@Example.com" />

    <label for="linkedin">LinkedIn</label>
    <input id="linkedin" value="https://linkedin.com/in/alan" />

    <label for="resumeUrl">Résumé URL on file (optional)</label>
    <input id="resumeUrl" placeholder="https://..." />

    <label for="resumeTempKey">Résumé temp key (optional)</label>
    <input id="resumeTempKey" value="temp-bucket/upload-123.pdf" />

    <label for="resumeFileName">Résumé file name</label>
    <input id="resumeFileName" value="resume.pdf" />

    <label for="notes">Notes (optional)</label>
    <textarea id="notes" rows="2"></textarea>

    <label>Screening answers</label>
    <div id="answerRows"></div>
    <button type="button" id="addAnswer">Add answer</button>

    <div>
      <button type="button" id="submit">Submit</button>
      <button type="button" id="submitConcurrent">Submit twice concurrently</button>
    </div>

    <h2>Result</h2>
    <p class="status" id="status"></p>
    <pre id="result"></pre>

    <section class="qa-controls" aria-label="QA inspection controls">
      <h2>QA controls</h2>
      <button type="button" id="resetTestState">Reset test data</button>
      <button type="button" id="inspectSubmission">Inspect submission</button>
      <button type="button" id="refreshRecorders">Refresh recorders and wait</button>
      <pre id="inspection"></pre>
    </section>

    <script type="module" src="/form.mjs"></script>
  </body>
</html>
